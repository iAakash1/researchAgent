# Per-agent wiring. `model` refers to an alias in models.yaml.
# Entries are layered over `defaults`, so only differences are listed.

defaults:
  model: reasoning
  prompt_version: v1
  timeout_seconds: 300
  enabled: true
  retry:
    max_attempts: 3
    initial_delay_seconds: 1.0
    max_delay_seconds: 30.0
    backoff_multiplier: 2.0
    jitter: true

agents:
  planner:
    model: reasoning
    prompt_version: v1
    options:
      min_research_questions: 3
      max_research_questions: 5
      max_queries: 8
      max_keywords_per_question: 6
