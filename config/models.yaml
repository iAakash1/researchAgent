# Agents bind to aliases. Each alias selects a primary provider/model; the single
# fallback is used only after a genuine primary-provider failure.

default: reasoning

fallback:
  provider: ollama
  model: llama3.1:8b
  description: Local fallback when hosted inference cannot serve a request.
  pricing:
    input_cache_hit: 0
    input_cache_miss: 0
    output: 0

models:
  reasoning:
    provider: deepseek
    model: deepseek-flash
    description: DeepSeek V4.1 Flash for planning, synthesis, verification and review.
    pricing:
      input_cache_hit: 0.006
      input_cache_miss: 0.3
      output: 1.2
    params:
      thinking: true
      reasoning_effort: high
      temperature: 0.3
      context_window: 32768
      max_output_tokens: 2048

  extraction:
    provider: deepseek
    model: deepseek-flash
    description: Lower-effort schema-constrained extraction.
    pricing:
      input_cache_hit: 0.006
      input_cache_miss: 0.3
      output: 1.2
    params:
      thinking: true
      reasoning_effort: low
      temperature: 0.0
      context_window: 16384
      max_output_tokens: 2048

  fast:
    provider: deepseek
    model: deepseek-flash
    description: Lower-effort classification and retrieval decisions.
    pricing:
      input_cache_hit: 0.006
      input_cache_miss: 0.3
      output: 1.2
    params:
      thinking: true
      reasoning_effort: low
      temperature: 0.1
      context_window: 8192
      max_output_tokens: 1024

  reasoning_local:
    provider: ollama
    model: llama3.1:8b
    description: Local reasoning without hosted inference.
    pricing:
      input_cache_hit: 0
      input_cache_miss: 0
      output: 0
    params:
      temperature: 0.3
      top_p: 0.9
      context_window: 32768
      max_output_tokens: 2048

  extraction_local:
    provider: ollama
    model: llama3.1:8b
    description: Local structured extraction.
    pricing:
      input_cache_hit: 0
      input_cache_miss: 0
      output: 0
    params:
      temperature: 0.0
      top_p: 0.9
      seed: 42
      context_window: 16384
      max_output_tokens: 2048

  # Retained for compatibility with existing deployments that explicitly select Groq.
  reasoning_remote:
    provider: groq
    model: openai/gpt-oss-120b
    description: Optional Groq-hosted reasoning model.
    params:
      temperature: 0.3
      top_p: 0.9
      context_window: 131072
      max_output_tokens: 2048
