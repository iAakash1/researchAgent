# Model catalogue. Agents reference aliases, never model tags.
# Swapping Qwen for Llama is an edit here plus `ollama pull` — no code change.

default: reasoning

models:
  reasoning:
    provider: ollama
    model: llama3.1:8b
    description: Planning, synthesis, gap discovery, review — long context, slower.
    params:
      temperature: 0.3
      top_p: 0.9
      context_window: 32768
      max_output_tokens: 2048

  extraction:
    provider: ollama
    model: llama3.1:8b
    description: Structured field extraction — near-deterministic, schema-constrained.
    params:
      temperature: 0.0
      top_p: 0.9
      seed: 42
      context_window: 16384
      max_output_tokens: 2048

  fast:
    provider: ollama
    model: llama3.1:8b
    description: Cheap classification and routing decisions.
    params:
      temperature: 0.1
      context_window: 8192
      max_output_tokens: 1024

  # Optional external inference. Requires GROQ_API_KEY; unused unless an agent asks for
  # this alias in config/agents.yaml, or LLM_PROVIDER=groq overrides the catalogue.
  # Model ids change — verify against https://console.groq.com/docs/models before editing.
  reasoning_remote:
    provider: groq
    model: openai/gpt-oss-120b
    description: Large remote reasoning model for synthesis and review.
    params:
      temperature: 0.3
      top_p: 0.9
      context_window: 131072
      # Groq charges reserved output tokens against the per-minute budget, so this must
      # leave room within the tier's per-minute budget (8000 TPM on the free tier)
      # for the prompt and a follow-up call, or consecutive requests 413/429.
      max_output_tokens: 2048
