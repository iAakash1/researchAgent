[project]
name = "researchagent"
version = "0.1.0"
description = "Local-first multi-agent research intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "langchain-core>=0.3.30",
    "langchain-ollama>=0.2.2",
    "httpx>=0.28",
    "structlog>=25.1",
    "pyyaml>=6.0",
    "ollama>=0.4",
    "langgraph>=1.2.10",
    "pymupdf>=1.28.2",
    "qdrant-client>=1.19.0",
    "neo4j>=6.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["researchagent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "ANN",
    "S",    # security (bandit)
    "BLE",  # no blind `except Exception` without re-raise
    "T20",  # no print() — the project uses structlog
]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# Tests may assert, and their fixtures don't need return annotations.
"tests/*" = ["ANN", "S101"]
# Scripts are command-line entry points: printing is how they report, and a single
# blocking mkdir when writing a results file is correct there — swapping in an async
# filesystem library would add a dependency to save nothing.
"scripts/*" = ["T201", "ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langchain_ollama.*", "langchain_core.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# importlib import mode: two test files may share a basename (tests/core/test_registry.py
# and tests/agents/test_registry.py) without colliding, and `from tests.conftest import ...`
# keeps working.
addopts = "-q --import-mode=importlib"
consider_namespace_packages = true
